name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning bin/t src/helpers.sh session-wizard.tmux scripts/run-tests.sh examples/*.sh

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build -t tmux-session-wizard:dev .
      - name: Run test suite (GNU userland)
        run: docker run --rm -v "$PWD:$PWD" -w "$PWD" tmux-session-wizard:dev bats -r ./tests

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install bats-core tmux fzf zoxide
      - name: Install bats libraries
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/bats-core/bats-support "$HOME/bats-libs/bats-support"
          git clone --depth 1 --branch v2.1.0 https://github.com/bats-core/bats-assert "$HOME/bats-libs/bats-assert"
      - name: Run test suite (BSD userland)
        run: BATS_LIB_PATH="$HOME/bats-libs" bats -r ./tests
